# Generated by k8s-mock-test from gpus/*.env; do not edit.
topology:
  nodePoolLabelKey: k8s-mock-test/gpu-type
  nodePools:
    default: null
    h100:
      gpuProduct: NVIDIA-H100-80GB-HBM3
      gpuCount: 8
      gpuMemory: 81920
      otherDevices:
        - name: nvidia.com/hostdev
          count: 8
    h200:
      gpuProduct: NVIDIA-H200
      gpuCount: 8
      gpuMemory: 143771
      otherDevices:
        - name: nvidia.com/hostdev
          count: 8
    b200:
      gpuProduct: NVIDIA-B200
      gpuCount: 8
      gpuMemory: 184320
      otherDevices:
        - name: nvidia.com/hostdev
          count: 12
    gb200:
      gpuProduct: NVIDIA-GB200
      gpuCount: 4
      gpuMemory: 190464
      otherDevices:
        - name: nvidia.com/hostdev
          count: 4
    gb300:
      gpuProduct: NVIDIA-GB300
      gpuCount: 4
      gpuMemory: 284672
      otherDevices:
        - name: nvidia.com/hostdev
          count: 4
# Gives KWOK nodes their nvidia.com/gpu capacity and the otherDevices above.
kwokGpuDevicePlugin:
  enabled: true
statusExporter:
  kwok:
    # Needs the Prometheus Operator CRDs; off so a bare cluster works.
    prometheusRule:
      enabled: false
# Real-node components, unused for KWOK nodes. Off so they can't collide with a
# real GPU Operator on nodes it labels (nvidia.com/gpu.deploy.device-plugin).
devicePlugin:
  enabled: false
migFaker:
  enabled: false
# Leave RuntimeClass "nvidia" to a real GPU Operator if the cluster has one.
runtimeClass:
  enabled: false
