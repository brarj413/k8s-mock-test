apiVersion: v1
kind: Pod
metadata:
  name: b200-full-node
  namespace: default
  labels:
    app.kubernetes.io/part-of: k8s-mock-test
    k8s-mock-test/gpu-type: b200
spec:
  restartPolicy: Never
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-B200
  tolerations:
    # Only needed for KWOK nodes; harmless elsewhere.
    - key: kwok.x-k8s.io/node
      operator: Equal
      value: fake
      effect: NoSchedule
  containers:
    - name: cuda
      image: nvcr.io/nvidia/cuda:12.4.1-base-ubuntu22.04
      command: ["sleep", "infinity"]
      resources:
        limits:
          nvidia.com/gpu: 8
